[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torznab"
description = "python implementation for torznab api"
readme = "README.md"
version = "0.0.2"
authors = [
  {name = "miikaoskari"}
]
license = {file = "LICENSE"}
keywords = ["torznab", "torrent"]
requires-python = ">=3.10"

dependencies = [
  "requests>=2.28.0",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/miikaoskari/torznab"

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "types-requests>=2.31.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

